<!DOCTYPE html>
<html lang="en">
<head>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { background: #1a1714; }

    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #ede9e4;
      background: #1a1714;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    input::placeholder { color: #78716c; }

    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #3a3532; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #4a4540; }

    @keyframes connPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    ::selection { background: rgba(232,146,58,0.3); color: #ede9e4; }
